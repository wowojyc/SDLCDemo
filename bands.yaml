# 越界闭环层级（bands.yaml）
# 谁写：工程负责人联合变更管理 / 合规，版本化配置。
# 放哪：仓库内，进版本控制。
# 怎么触发：触发器层唤起（CI 定时 workflow / 监控栈 webhook / 内网 Cron）；只有越界才唤起 AI。
# 原则：检测保持确定性（不用 AI 判断"有没有越界"）；层级决定 AI 能做什么（1σ 日志 / 2σ 只读诊断 / 3σ 可行动）。

# 本仓库实例：CI 失败率（ci_test_failure_rate）
# 注意：σ 阈值（Western Electric 1/2/3σ + 最近 6 点单调漂移）实现在 scripts/detect_drift.py（硬编码、有单测），
#       bands.yaml 声明层级与动作（log/diagnose/act）；二者由 .github/workflows/maintenance-scan.yml 的 job 结构绑定。
# 数据流：maintenance-scan collect job 每日采集（scripts/collect_ci_failure_rate.py）→ 追加 metrics/ci_test_failure_rate.json
#       （真身维护在 metrics-data 分支：main 受分支保护须走 PR，采集写回走独立数据分支；ci.yml 只监听 main，天然不递归）
#       → detect job 从 metrics-data 载入历史，读 values[-1] → detect_drift.py 分档。

metric: ci_test_failure_rate
baseline: rolling_30d          # 基线窗口：最近 30 次 main push 采样的滚动窗口
rules: western_electric        # 判异规则：1/2/3σ + 单调漂移（实现在 scripts/detect_drift.py）

tiers:
  1sigma:
    action: log                # 只记录，不动作
  2sigma:
    action: diagnose           # 只读诊断，给结论
    tools: "Read,Grep,Bash(gh run view *)"
  3sigma:
    action: propose            # 可行动，但只开 PR 走审查门，不直接改生产
    routes:
      - pull_request
      - runbook: rollback-deploy
