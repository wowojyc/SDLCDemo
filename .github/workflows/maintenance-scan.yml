name: maintenance-scan

# 06 维护 · 闭环（bands 的落地）
#
# 三段式，对应 bands.yaml：
#   1σ 内        → 只记日志
#   越出 2σ      → 唤起 AI 做只读诊断（给结论，不改东西）
#   越出 3σ      → 可行动（开 Issue / 开 PR），但仍走审查门
#
# 铁律：**检测保持确定性**（scripts/detect_drift.py 算，不用 AI 判断有没有越界）。

on:
  schedule:
    # 注意：cron 用的是 UTC 时间。
    # UTC 19:00 = 北京时间次日 03:00
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      value:
        description: '手动指定当前指标值（用来测试分档，如 0.35）'
        required: false

jobs:
  # 采集：拉真实 CI 失败率写回 metrics（维护闭环的“传感器”）。
  # 失败可见但不断链（continue-on-error），detect 用 if: always() 读旧值继续。
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集 CI 失败率并写回 metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/collect_ci_failure_rate.py
          if git diff --quiet metrics/ci_test_failure_rate.json; then
            echo "metrics 无变化（窗口内无新 run 或值未变），跳过写回"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/ci_test_failure_rate.json
          # [skip ci] 防递归触发 ci.yml；#18 防 check-commit-refs 误伤
          git commit -m "metrics: 追加 CI 失败率采样 (#18) [skip ci]"
          git push origin HEAD:main

  detect:
    needs: collect
    if: always()  # collect 失败（run 黄）也继续检测：读旧值分档，不静默断链
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.detect.outputs.tier }}
      summary: ${{ steps.detect.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定性检测（无 AI 参与）
        id: detect
        run: |
          VALUE="${{ github.event.inputs.value }}"
          if [ -z "$VALUE" ]; then
            VALUE=$(jq -r '.values[-1]' metrics/ci_test_failure_rate.json)
          fi
          echo "当前值：$VALUE"

          python scripts/detect_drift.py \
            --metric ci_test_failure_rate \
            --value "$VALUE" \
            --history-file metrics/ci_test_failure_rate.json \
            > drift.json || true

          cat drift.json
          echo "tier=$(jq -r '.tier' drift.json)" >> "$GITHUB_OUTPUT"
          echo "summary=$(jq -r '.reason' drift.json)" >> "$GITHUB_OUTPUT"

      - name: 归档检测结果
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift.json

  diagnose:
    needs: detect
    if: needs.detect.outputs.tier == '2sigma'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 只读诊断（远端 LLM，不修改任何文件）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.siliconflow.cn/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-ai/DeepSeek-V3' }}
        run: |
          # 打包上下文：指标历史 + CI 配置，让 LLM 基于事实诊断
          {
            echo "仓库指标出现异常漂移：${{ needs.detect.outputs.summary }}"
            echo ""
            echo "--- metrics/ci_test_failure_rate.json ---"
            cat metrics/ci_test_failure_rate.json
            echo ""
            echo "--- .github/workflows/ci.yml ---"
            cat .github/workflows/ci.yml
            echo ""
            echo "请只做**只读诊断**：基于上述指标与 CI 配置，给出可能原因和排查建议。不要修改任何文件，不要给模糊结论。"
          } > /tmp/diagnose-prompt.txt

          jq -n --arg model "$LLM_MODEL" --rawfile content /tmp/diagnose-prompt.txt \
            '{model: $model, messages: [{role: "user", content: $content}], max_tokens: 2048}' |
            curl -sS --max-time 300 -X POST "$LLM_BASE_URL/chat/completions" \
              -H "Authorization: Bearer $LLM_API_KEY" \
              -H "Content-Type: application/json" \
              -d @- > diagnose.json || true

          jq -r '.choices[0].message.content // .error.message // "（LLM 调用失败）"' diagnose.json \
            >> "$GITHUB_STEP_SUMMARY"

  act:
    needs: detect
    if: needs.detect.outputs.tier == '3sigma'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: 开一个 Issue（走人的分诊队列）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "指标越界：ci_test_failure_rate（${{ needs.detect.outputs.summary }}）" \
            --body "由 maintenance-scan 自动检测发现（确定性脚本判定，非 AI 判断）。

          检测结论：${{ needs.detect.outputs.summary }}

          请人工分诊：**现在修 / 排期 / 忽略**。
          若是共性问题，请按 intent/intent.md 的六字段写成新需求，重新走 01→06 流程。
          修复上线后，记得补一条 eval（evals/）。" \
            --label "auto-detected" || echo "（label 不存在，已忽略）"
