name: agent-evals

# 04 测试 · CI 中的持续评估
#
# 评的不是"产品功能对不对"，而是"AI 写码的能力有没有退化"。
# 因为这些配置在"驾驶"AI（AGENTS.md / .qoder/rules / hooks），
# 所以配置一变就要像测代码一样做回归。
#
# 两类触发：配置变更（谁改谁先过考）+ 每天定时兜底。
# 前置：Secrets 配 LLM_API_KEY（硅基流动：https://cloud.siliconflow.com 获取）
# 可选：LLM_BASE_URL / LLM_MODEL 仓库变量，默认硅基流动 + DeepSeek-V3
#
# 执行方式：远端 LLM 产出 unified diff 补丁 → 应用后跑确定性检查（evals/check.sh）。

on:
  pull_request:
    paths: ['AGENTS.md', '.qoder/**', 'Makefile']
  schedule:
    # cron 用 UTC：UTC 18:00 = 北京时间次日 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run eval suite
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.siliconflow.cn/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-ai/DeepSeek-V3' }}
        run: |
          failed=0
          total=0
          for eval_file in evals/*.json; do
            total=$((total+1))
            prompt=$(jq -r '.prompt' "$eval_file")

            echo "=== 运行 eval: $eval_file ==="
            # 让远端 LLM 产出可应用的补丁（OpenAI 兼容协议）
            {
              echo "你是资深工程师。请完成下面的任务，只输出可应用的 unified diff（git diff 格式，用 \`\`\`diff 代码块包裹），不要解释。"
              echo "任务：$prompt"
            } > /tmp/eval-prompt.txt

            jq -n --arg model "$LLM_MODEL" --rawfile content /tmp/eval-prompt.txt \
              '{model: $model, messages: [{role: "user", content: $content}], max_tokens: 2048}' |
              curl -sS --max-time 300 -X POST "$LLM_BASE_URL/chat/completions" \
                -H "Authorization: Bearer $LLM_API_KEY" \
                -H "Content-Type: application/json" \
                -d @- > result.json

            # 提取 ```diff 代码块并应用
            jq -r '.choices[0].message.content // empty' result.json > /tmp/model-output.txt
            awk '/^```diff/{flag=1; next} /^```/{flag=0} flag' /tmp/model-output.txt > /tmp/change.patch
            if [ -s /tmp/change.patch ] && git apply --check /tmp/change.patch 2>/dev/null; then
              git apply /tmp/change.patch
              echo "已应用模型补丁（$(wc -l < /tmp/change.patch) 行）"
            else
              echo "::warning::模型未产出可应用补丁，该 eval 视为未通过"
            fi

            if ! ./evals/check.sh "$eval_file" result.json; then
              failed=$((failed+1))
              echo "::warning file=$eval_file::该 eval 未通过"
            fi
            git reset --hard HEAD 2>/dev/null || true
          done

          echo "总计 $total 个 eval，失败 $failed 个" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "通过率下降，请先评审配置变更再合并。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
